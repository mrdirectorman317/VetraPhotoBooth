<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e0e0e">
  <title>Save Your Photos – Vetra Photo Booth</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0e0e; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100dvh;
      padding-bottom: max(env(safe-area-inset-bottom, 16px), 16px);
    }

    .header {
      background: #111; padding: 20px 24px 16px;
      text-align: center; border-bottom: 1px solid #222;
    }
    .logo {
      font-size: 18px; font-weight: 900; color: #f0c060;
      letter-spacing: 5px; text-transform: uppercase;
    }
    .subtitle { font-size: 14px; color: #666; margin-top: 4px; }

    #loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px; padding: 80px 20px;
      color: #666; font-size: 17px;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 5px solid rgba(240,192,96,0.2);
      border-top-color: #f0c060;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #content { display: none; padding: 0; }

    /* Save button — big and prominent */
    .save-section {
      padding: 20px 20px 0;
      display: flex; flex-direction: column; gap: 10px;
    }

    .save-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 18px 24px;
      border: none; border-radius: 16px;
      font-size: 19px; font-weight: 700;
      cursor: pointer; letter-spacing: 0.3px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, transform 0.1s;
      background: #f0c060; color: #111;
    }
    .save-btn:active { opacity: 0.78; transform: scale(0.97); }
    .save-btn.success { background: #3ad07a; color: #fff; pointer-events: none; }
    .save-btn.secondary {
      background: #1e1e1e; color: #fff; border: 2px solid #333;
      font-size: 16px; padding: 14px 20px;
    }

    /* Strips */
    .strips { padding: 16px 20px 0; display: flex; flex-direction: column; gap: 16px; }

    .strip-card {
      background: #161616; border-radius: 16px;
      overflow: hidden; border: 1px solid #222;
    }
    .strip-card-label {
      font-size: 11px; font-weight: 700; color: #444;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 12px 16px 8px;
    }
    .strip-card-label.bonus { color: #f0c060; }
    .strip-card img { display: block; width: 100%; height: auto; }

    /* Tip */
    .tip-box {
      margin: 16px 20px 0;
      background: #181818; border: 1px solid #2a2a2a;
      border-radius: 12px; padding: 14px 16px;
      font-size: 13px; color: #888; line-height: 1.55;
      text-align: center;
    }
    .tip-box strong { color: #f0c060; }

    .footer {
      text-align: center; padding: 24px 20px 8px;
      font-size: 12px; color: #333;
      letter-spacing: 2px; text-transform: uppercase;
    }

    #error-box {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; padding: 80px 24px; text-align: center;
    }
    .error-icon { font-size: 52px; }
    .error-text { font-size: 19px; color: #f06060; }
    .error-sub  { font-size: 15px; color: #555; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">VETRA PHOTO BOOTH</div>
  <div class="subtitle">Your photo strips are ready!</div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div>Loading your photos&hellip;</div>
</div>

<div id="content">

  <div class="save-section">
    <button id="save-all-btn" class="save-btn" onclick="saveAll()">
      📸&nbsp; Save All to Photos
    </button>
  </div>

  <div class="strips">
    <div class="strip-card">
      <div class="strip-card-label">YOUR STRIP</div>
      <img id="main-img" src="" alt="Your Photo Strip">
    </div>

    <div id="bonus-card" class="strip-card" style="display:none;">
      <div class="strip-card-label bonus">BONUS STRIP</div>
      <img id="bonus-img" src="" alt="Bonus Photo Strip">
    </div>
  </div>

  <div class="save-section" style="padding-top: 8px;">
    <button class="save-btn secondary" onclick="saveMain()">Save Your Strip Only</button>
    <button id="save-bonus-btn" class="save-btn secondary" onclick="saveBonus()" style="display:none;">Save Bonus Strip Only</button>
  </div>

  <div class="tip-box" id="tip-box"></div>

  <div class="footer">VETRA PHOTO BOOTH</div>
</div>

<div id="error-box">
  <div class="error-icon">😕</div>
  <div class="error-text">Photo not found.</div>
  <div class="error-sub">Please scan the QR code again from the booth.</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const mainUrl = params.get('img');
  const bonusUrl = params.get('bonus');

  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isAndroid = /Android/i.test(navigator.userAgent);

  let imagesLoaded = 0;
  let imagesToLoad = 1;

  function init() {
    if (!mainUrl) { showError(); return; }

    if (bonusUrl) {
      imagesToLoad = 2;
      document.getElementById('bonus-card').style.display = '';
      document.getElementById('save-bonus-btn').style.display = '';
    }

    const mainImg = document.getElementById('main-img');
    mainImg.crossOrigin = 'anonymous';
    mainImg.onload = onImageLoaded;
    mainImg.onerror = () => showError();
    mainImg.src = mainUrl;

    if (bonusUrl) {
      const bonusImg = document.getElementById('bonus-img');
      bonusImg.crossOrigin = 'anonymous';
      bonusImg.onload = onImageLoaded;
      bonusImg.onerror = () => { imagesToLoad--; onImageLoaded(); }; // Still show if bonus fails
      bonusImg.src = bonusUrl;
    }

    // Platform tip
    const tipBox = document.getElementById('tip-box');
    if (isIOS) {
      tipBox.innerHTML = '<strong>iPhone/iPad:</strong> Tap "Save All" and choose <strong>"Save Image"</strong> for each strip in the share sheet.';
    } else if (isAndroid) {
      tipBox.innerHTML = '<strong>Android:</strong> Tap "Save All" — photos will save to your <strong>Downloads</strong> or <strong>Gallery</strong>.';
    } else {
      tipBox.innerHTML = 'Tap the buttons above to download your photo strips.';
    }
  }

  function onImageLoaded() {
    imagesLoaded++;
    if (imagesLoaded >= imagesToLoad) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    }
  }

  function showError() {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-box').style.display = 'flex';
  }

  // Share/download a single image
  async function shareOrDownload(url, filename, btn) {
    try {
      const response = await fetch(url);
      const blob = await response.blob();
      const file = new File([blob], filename, { type: 'image/jpeg' });

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: 'Vetra Photo Booth'
        });
        return true;
      }

      // Fallback: blob download
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
      return true;

    } catch (e) {
      if (e.name === 'AbortError') return false; // User cancelled
      console.error('Save failed:', e);
      window.open(url, '_blank');
      return false;
    }
  }

  async function saveAll() {
    const btn = document.getElementById('save-all-btn');
    btn.textContent = 'Saving…';
    btn.style.pointerEvents = 'none';

    // Try sharing both via Web Share API (shares one at a time on iOS)
    try {
      const urls = [mainUrl];
      if (bonusUrl) urls.push(bonusUrl);

      const blobs = await Promise.all(urls.map(u => fetch(u).then(r => r.blob())));
      const files = blobs.map((blob, i) =>
        new File([blob], i === 0 ? 'vetra-strip.jpg' : 'vetra-bonus-strip.jpg', { type: 'image/jpeg' })
      );

      if (navigator.share && navigator.canShare && navigator.canShare({ files })) {
        await navigator.share({ files, title: 'Vetra Photo Booth' });
        showBtnSuccess(btn, 'Save All to Photos');
        return;
      }

      // Fallback: download each
      for (let i = 0; i < blobs.length; i++) {
        const blobUrl = URL.createObjectURL(blobs[i]);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = files[i].name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
        if (i < blobs.length - 1) await new Promise(r => setTimeout(r, 500));
      }
      showBtnSuccess(btn, 'Save All to Photos');

    } catch (e) {
      if (e.name === 'AbortError') {
        btn.textContent = '📸  Save All to Photos';
        btn.style.pointerEvents = '';
        return;
      }
      console.error('Save all failed:', e);
      btn.textContent = '📸  Save All to Photos';
      btn.style.pointerEvents = '';
    }
  }

  function saveMain() { shareOrDownload(mainUrl, 'vetra-strip.jpg'); }
  function saveBonus() { if (bonusUrl) shareOrDownload(bonusUrl, 'vetra-bonus-strip.jpg'); }

  function showBtnSuccess(btn, resetText) {
    btn.textContent = '✅  Saved!';
    btn.classList.add('success');
    setTimeout(() => {
      btn.textContent = '📸  ' + resetText;
      btn.classList.remove('success');
      btn.style.pointerEvents = '';
    }, 3000);
  }

  init();
</script>
</body>
</html>
