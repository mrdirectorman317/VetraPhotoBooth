<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Save Your Photos – Vetra Photo Booth</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0e0e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    .header {
      background: #111;
      padding: 20px 24px 16px;
      text-align: center;
      border-bottom: 1px solid #222;
    }
    .logo {
      font-size: 22px;
      font-weight: 900;
      color: #f0c060;
      letter-spacing: 6px;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 16px;
      color: #888;
      margin-top: 4px;
    }

    /* ── Loading ── */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 60px 20px;
      color: #888;
      font-size: 18px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 6px solid rgba(240,192,96,0.2);
      border-top-color: #f0c060;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Content ── */
    #content { padding: 24px 16px; }
    #content.hidden, #loading.hidden, #error-box.hidden { display: none !important; }

    /* Save buttons – big, thumb-friendly */
    .save-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .save-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 20px 24px;
      border: none;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s, transform 0.1s;
    }
    .save-btn:active { opacity: 0.8; transform: scale(0.98); }

    .save-btn.primary {
      background: #f0c060;
      color: #111;
    }
    .save-btn.secondary {
      background: #222;
      color: #fff;
      border: 2px solid #333;
    }

    .save-hint {
      font-size: 14px;
      color: #666;
      text-align: center;
      line-height: 1.5;
      padding: 0 8px;
    }

    /* iOS long-press note */
    .ios-note {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      color: #aaa;
      line-height: 1.55;
      text-align: center;
      margin-bottom: 20px;
    }
    .ios-note strong { color: #f0c060; }

    /* Photo previews */
    .strips-title {
      font-size: 16px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .strip-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .strip-card {
      background: #181818;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #222;
    }
    .strip-card-label {
      font-size: 13px;
      font-weight: 700;
      color: #555;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 12px 16px 8px;
    }
    .strip-card img {
      display: block;
      width: 100%;
      height: auto;
    }
    .strip-card-actions {
      padding: 12px 16px;
    }
    .strip-inline-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .strip-inline-btn:active { opacity: 0.75; }
    .strip-inline-btn.v-btn { background: #f0c060; color: #111; }
    .strip-inline-btn.h-btn { background: #222; color: #fff; border: 2px solid #333; }

    /* Error */
    #error-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 60px 24px;
      text-align: center;
    }
    .error-icon  { font-size: 56px; }
    .error-text  { font-size: 20px; color: #ff6060; }
    .error-sub   { font-size: 16px; color: #666; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">VETRA PHOTO BOOTH</div>
    <div class="subtitle">Your photos are ready!</div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div>Loading your photos…</div>
  </div>

  <div id="content" class="hidden">

    <!-- Primary save actions -->
    <div class="save-section">
      <button class="save-btn primary" onclick="saveVertical()">
        <span>📸</span> Save Vertical Strip
      </button>
      <button class="save-btn secondary" onclick="saveHorizontal()">
        <span>📸</span> Save Horizontal Strip
      </button>
    </div>

    <!-- iOS fallback hint (shown only on iOS) -->
    <div id="ios-note" class="ios-note hidden">
      <strong>On iPhone:</strong> tap a button above — a share sheet will open.<br>
      Choose <strong>"Save Image"</strong> to add it to your Photos.
    </div>

    <div id="save-hint" class="save-hint"></div>

    <!-- Photo previews with per-strip save buttons -->
    <div style="margin-top:32px">
      <div class="strips-title">Your Strips</div>
      <div class="strip-group">

        <div class="strip-card">
          <div class="strip-card-label">Vertical</div>
          <img id="vertical-img" src="" alt="Vertical photo strip">
          <div class="strip-card-actions">
            <button class="strip-inline-btn v-btn" onclick="saveVertical()">
              Save to Photos
            </button>
          </div>
        </div>

        <div class="strip-card">
          <div class="strip-card-label">Horizontal</div>
          <img id="horizontal-img" src="" alt="Horizontal photo strip">
          <div class="strip-card-actions">
            <button class="strip-inline-btn h-btn" onclick="saveHorizontal()">
              Save to Photos
            </button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <div id="error-box" class="hidden">
    <div class="error-icon">😕</div>
    <div class="error-text">Photos not found.</div>
    <div class="error-sub">Please scan the QR code again.</div>
  </div>

  <script>
    const id = window.location.pathname.replace(/^\/save\//, '');
    let verticalUrl   = '';
    let horizontalUrl = '';

    const isIOS     = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isMobile  = isIOS || isAndroid;

    async function init() {
      try {
        const res = await fetch(`/api/photos/${id}`);
        if (!res.ok) throw new Error('not found');
        const data = await res.json();

        // Photos served from the local server
        verticalUrl   = data.vertical;
        horizontalUrl = data.horizontal;

        document.getElementById('vertical-img').src   = verticalUrl;
        document.getElementById('horizontal-img').src = horizontalUrl;

        // Show iOS hint
        if (isIOS) {
          document.getElementById('ios-note').classList.remove('hidden');
        }

        // Hint text
        const hint = document.getElementById('save-hint');
        if (isAndroid) {
          hint.textContent = 'The photo will be saved to your Downloads or Gallery.';
        } else if (!isMobile) {
          hint.textContent = 'On desktop, the image will be downloaded to your computer.';
        }

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
      } catch (e) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error-box').classList.remove('hidden');
      }
    }

    async function shareOrDownload(url, filename) {
      // Try Web Share API with file (iOS 15+, Android Chrome)
      if (navigator.share && navigator.canShare) {
        try {
          const response = await fetch(url);
          const blob     = await response.blob();
          const file     = new File([blob], filename, { type: 'image/jpeg' });
          if (navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Vetra Photo Booth' });
            return;
          }
        } catch (e) {
          if (e.name === 'AbortError') return; // user cancelled – don't fall through
        }
      }
      // Fallback: trigger download
      const a = document.createElement('a');
      a.href     = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function saveVertical()   { shareOrDownload(verticalUrl,   'vetra-strip-vertical.jpg'); }
    function saveHorizontal() { shareOrDownload(horizontalUrl, 'vetra-strip-horizontal.jpg'); }

    init();
  </script>
</body>
</html>
